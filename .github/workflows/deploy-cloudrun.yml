name: CI & Deploy EuVerso Institucional (euverso-landing)

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: euverso-landing-${{ github.ref }}
  cancel-in-progress: true

env:
  GCP_PROJECT_ID: euverso
  GCP_REGION: southamerica-east1
  SERVICE_NAME: euverso-landing
  ARTIFACT_REPO: euverso-containers
  WIF_PROVIDER: projects/363585252246/locations/global/workloadIdentityPools/github-actions-pool/providers/github-provider
  WIF_SERVICE_ACCOUNT: euverso-build-sa@euverso.iam.gserviceaccount.com

jobs:
  verify:
    name: Typecheck & Next.js SSG Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript typecheck
        run: npm run typecheck

      - name: Build production SSG/SSR bundle
        env:
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL || 'https://euverso.com' }}
          NEXT_PUBLIC_WHATSAPP_NUMBER: ${{ secrets.NEXT_PUBLIC_WHATSAPP_NUMBER }}
          NEXT_OUTPUT_STANDALONE: "true"
        run: npm run build

  deploy-cloudrun:
    name: Build Container & Deploy euverso-landing
    runs-on: ubuntu-latest
    needs: [verify]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud (Workload Identity Federation)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.WIF_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "$GCP_REGION-docker.pkg.dev" --quiet

      - name: Build and push Docker image
        env:
          IMAGE_SHA: ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.ARTIFACT_REPO }}/${{ env.SERVICE_NAME }}:${{ github.sha }}
          IMAGE_LATEST: ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.ARTIFACT_REPO }}/${{ env.SERVICE_NAME }}:latest
        run: |
          docker build \
            --build-arg NEXT_PUBLIC_SITE_URL="${{ vars.NEXT_PUBLIC_SITE_URL || 'https://euverso.com' }}" \
            --build-arg NEXT_PUBLIC_WHATSAPP_NUMBER="${{ secrets.NEXT_PUBLIC_WHATSAPP_NUMBER }}" \
            -t "$IMAGE_SHA" \
            -t "$IMAGE_LATEST" .
          docker push "$IMAGE_SHA"
          docker push "$IMAGE_LATEST"

      - name: Deploy to Cloud Run (euverso-landing)
        run: |
          gcloud run deploy "$SERVICE_NAME" \
            --image="$GCP_REGION-docker.pkg.dev/$GCP_PROJECT_ID/$ARTIFACT_REPO/$SERVICE_NAME:${{ github.sha }}" \
            --region="$GCP_REGION" \
            --project="$GCP_PROJECT_ID" \
            --platform=managed \
            --port=8080 \
            --cpu=1 \
            --memory=512Mi \
            --min-instances=0 \
            --max-instances=20 \
            --allow-unauthenticated

      - name: Smoke test deployed service and canonical domain
        run: |
          SERVICE_URL=$(gcloud run services describe "$SERVICE_NAME" --region="$GCP_REGION" --project="$GCP_PROJECT_ID" --format="value(status.url)")
          echo "Cloud Run URL: $SERVICE_URL"
          curl -fsSI "$SERVICE_URL/" | head -n 5
          curl -fsSI "$SERVICE_URL/sitemap.xml" | head -n 5
          curl -fsSI "https://euverso.com/" | head -n 5
          {
            echo "### Deploy concluido em \`euverso-landing\`"
            echo ""
            echo "- **Servico Cloud Run**: \`euverso-landing\` (\`southamerica-east1\`, projeto \`euverso\`)"
            echo "- **Dominio publico**: https://euverso.com"
            echo "- **Commit**: \`${{ github.sha }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
